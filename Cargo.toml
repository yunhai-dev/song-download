[package]
name = "song-download"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.22"
dirs = "6"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
lyrics-crypto = "0.5.1"
reqwest = { version = "0.13", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
